name: json-updater

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'
  schedule:
    - cron: '0 * * * *' # every hour

permissions:
  contents: write

# The hourly schedule can overlap with a push, and two runs committing to master at once is how you
# get a rejected push or a lost update.
concurrency:
  group: json-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # update.sh runs the SourceTree scrapers through dotnet-script. Without this the job depended
      # on whichever .NET happened to ship in the runner image.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache dotnet-script
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: dotnet-script-${{ runner.os }}

      - name: Update feeds
        run: ./json-backups/update.sh

      # always(), because update.sh exits non-zero when a feed fails while still leaving every feed
      # that did update in place. Skipping the commit would throw those away and the next run would
      # fetch them all over again.
      - name: Commit changes
        id: commit
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Atlassian JSON Autoupdated
          commit_user_name: stamepicmorg
          commit_user_email: stamepicmorg@users.noreply.github.com
          commit_author: stamepicmorg <stamepicmorg@users.noreply.github.com>

      # Notifying from here rather than from a workflow listening for a push, because a push made
      # with the default GITHUB_TOKEN raises no event: GitHub suppresses it so that automation
      # cannot trigger itself in a loop. telegram-informer.yml listens for exactly that push, which
      # is why it never fires for these commits.
      #
      # The id above matters too. The version of this step that used to sit here commented out
      # tested steps.auto-commit-action.outputs.changes_detected against a step that carried no id,
      # so the condition was always empty and never true.
      - name: Notify Telegram
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          curl --silent --show-error --fail --output /dev/null \
            --request POST "${{ secrets.TLG_URL }}" \
            --data-urlencode "chat_id=${{ secrets.TLG_CHAT }}" \
            --data-urlencode "text=${{ secrets.TLG_TEXT }}" \
            --data-urlencode "parse_mode=HTML"
